<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Work In Progress</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#0f172a;
    color:white;
    overflow:hidden;
}

.container{
    position:relative;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.background{
    position:absolute;
    width:100%;
    height:100%;
    background-image:url('https://images.unsplash.com/photo-1584198414538-f469f6fad430?q=80&w=1963&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    filter:brightness(0.35);
    transform:scale(1.05);
}

.content{
    position:relative;
    z-index:2;
    max-width:700px;
    padding:20px;
}

.logo{
    font-size:20px;
    letter-spacing:4px;
    margin-bottom:20px;
    color:#38bdf8;
}

h1{
    font-size:64px;
    font-weight:700;
    margin-bottom:20px;
}

p{
    font-size:20px;
    line-height:1.7;
    color:#e2e8f0;
    margin-bottom:40px;
}

.badge{
    display:inline-block;
    padding:14px 28px;
    border-radius:50px;
    background:#38bdf8;
    color:#0f172a;
    font-weight:600;
    font-size:18px;
}

.footer{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    font-size:14px;
    color:#cbd5e1;
}

@media(max-width:768px){

    h1{
        font-size:42px;
    }

    p{
        font-size:16px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="background"></div>

    <div class="content">

        <div class="logo">
            TOVIS PTE. LTD.
        </div>

        <h1>
            Work In Progress
        </h1>

        <p>
            We are building something amazing for hawkers, restaurants and retail businesses across Southeast Asia.
            Stay tuned.
        </p>

        <div class="badge">
            🚀 Launching Soon
        </div>

    </div>

    <div class="footer">
        © 2026 TOVIX. All rights reserved.
    </div>

</div>

</body>
</html>
